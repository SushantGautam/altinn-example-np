name: Demo checks
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r api/requirements.txt
      - name: Python syntax
        run: python -m compileall -q api
      - name: API and authorization tests
        working-directory: api
        run: python -m pytest -q
      - name: Browser script syntax
        run: node --check api/static/app.js
      - name: Docker Compose validation
        run: docker compose config --quiet

  container-smoke:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Start complete local demo
        run: docker compose up --build -d
      - name: Wait for API and OIDC identity provider
        run: |
          for i in $(seq 1 75); do
            if curl -fsS http://localhost:8000/health >/dev/null && curl -fsS http://localhost:8081/realms/nepal-demo/.well-known/openid-configuration >/dev/null; then
              echo "Both API and OIDC provider are ready"
              exit 0
            fi
            sleep 4
          done
          docker compose logs --tail 120
          exit 1
      - name: Confirm real OIDC discovery and API readiness
        run: |
          curl -fsS http://localhost:8000/health | python -c 'import json,sys; x=json.load(sys.stdin); assert x["ok"] and not x["altinn_connected"]'
          curl -fsS http://localhost:8081/realms/nepal-demo/.well-known/openid-configuration | python -c 'import json,sys; x=json.load(sys.stdin); assert x["issuer"] == "http://localhost:8081/realms/nepal-demo"'
          curl -fsS http://localhost:8000/api/demo-users | python -c 'import json,sys; a=json.load(sys.stdin); assert len(a)==5'
      - name: Exercise OIDC authorization code and full citizen workflow
        run: python scripts/smoke_oidc.py
      - name: Logs if smoke test failed
        if: failure()
        run: docker compose logs --tail 150
      - name: Stop containers
        if: always()
        run: docker compose down -v
