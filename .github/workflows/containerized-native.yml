name: All-Docker Altinn Nepal demonstration
on:
  push:
    paths:
      - '.github/workflows/containerized-native.yml'
      - 'native-altinn/**'
      - 'scripts/demo.sh'
      - 'scripts/start-all.sh'
      - 'scripts/stop-all.sh'
      - 'demo'
      - 'docker-compose.yml'
      - 'identity/nepal-realm.json'
      - 'api/**'
  workflow_dispatch:
jobs:
  full-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell entrypoints
        run: |
          bash -n demo scripts/demo.sh scripts/start-all.sh scripts/start-native.sh scripts/stop-all.sh
          test "$(./demo help | grep -c 'all runtime services in Docker')" -eq 1
      - name: Install official Altinn studioctl (host CLI, no host .NET SDK)
        run: |
          curl --fail --silent --show-error --location https://altinn.studio/designer/api/v1/studioctl/install.sh -o /tmp/studioctl-install.sh
          sh /tmp/studioctl-install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Start every runtime component using the one-command launcher
        run: ./demo up
      - name: Verify actual native Altinn app and all services are containers
        run: |
          docker inspect -f '{{.State.Running}}' localtest-app-nepal-licence | grep -qx true
          docker inspect -f '{{range $n, $_ := .NetworkSettings.Networks}}{{println $n}}{{end}}' localtest-app-nepal-licence | grep -qx 'altinn-nepal_default'
          docker exec --user 1000 localtest-app-nepal-licence sh -c 'test -r /tmp/altinn-nepal-bridge.json'
          for i in $(seq 1 75); do
            if curl -fsS http://localhost:8085/health >/dev/null && curl -fsS http://localhost:8081/realms/nepal-demo/.well-known/openid-configuration >/dev/null; then
              break
            fi
            sleep 4
          done
          curl -fsS http://localhost:8085/health
          docker exec localtest-app-nepal-licence sh -c 'wget -qO- http://portal:8000/health'
          code=000
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -H "Host: local.altinn.cloud" http://127.0.0.1:8000/ttd/nepal-licence/ || true)
            echo "Native Altinn route returned HTTP $code"
            if [[ "$code" =~ ^(200|301|302|303|307|308)$ ]]; then
              break
            fi
            sleep 2
          done
          [[ "$code" =~ ^(200|301|302|303|307|308)$ ]]
          PORTAL_BASE_URL=http://localhost:8085 python scripts/smoke_oidc.py
      - name: Stop all runtimes via the same launcher and verify teardown
        run: |
          ./demo down
          if docker ps --format '{{.Names}}' | grep -E '^(localtest-|altinn-nepal-)'; then
            echo "Demo containers remain after down"
            exit 1
          fi
          if docker network inspect altinn-nepal_default >/dev/null 2>&1; then
            echo "Demo Compose network was not removed"
            exit 1
          fi
          test ! -e .demo.local.env
          echo "PASS: all running components were Docker containers; down removed demo containers and network"
      - name: Verify explicit cleanup removes simulator state
        run: |
          ./demo clean --yes
          if docker volume ls --format '{{.Name}}' | grep -Fxq 'altinn-nepal_demo-data'; then
            echo "Demo data volume still exists after clean"
            exit 1
          fi
          echo "PASS: clean --yes removed simulator data volume"
      - name: Diagnostic logs if any step fails
        if: failure()
        run: |
          ./demo status || true
          ./demo logs || true
          docker ps -a || true
      - name: Cleanup even after a failed run
        if: always()
        run: ./demo down || true
